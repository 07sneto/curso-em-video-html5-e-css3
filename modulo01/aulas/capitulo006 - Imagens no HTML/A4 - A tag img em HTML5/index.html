<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testes com Imagens</title>
</head>
<body>

    <h1>Testando carga e Imagens</h1>

    <p>Abaixo você vai ver uma imagem que está na mesma pasta.</p>
    <img src="logo-html.png" alt="Logo HTML5">
    <!-- A imagem está na mesma pasta do arquivo HTML. -->

    <p>Podemos também carregar imagens que estão em sub-pastas.</p>
    <img src="imagens/logo-css.png" alt="Logo CSS3">
    <!-- A imagem está em uma sub-pasta do arquivo HTML. -->
    
    <p>Também podemos carregar imagens externas</p>
    <img src="https://bognarjunior.wordpress.com/wp-content/uploads/2018/01/1crcyaithv7aiqh1z93v99q.png" alt="Logo Javascript">
    <!-- A imagem está em um endereço externo, em um site, em uma URL. -->

</body>
</html>
