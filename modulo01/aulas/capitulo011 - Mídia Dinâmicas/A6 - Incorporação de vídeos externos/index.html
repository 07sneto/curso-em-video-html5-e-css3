<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>

    <h1>Inserindo vídeos do YouTube</h1>

    <!-- Vantagem: Usar vídeos do YouTube como externos economiza espaço no servidor, reduz consumo de banda e evita sobrecarga, mantendo melhor desempenho do site -->

    <iframe width="560" height="315" src="https://www.youtube.com/embed/LW0bhKitRBk?si=UWTQd7DkSM3SHycS" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    
</body>
</html>
