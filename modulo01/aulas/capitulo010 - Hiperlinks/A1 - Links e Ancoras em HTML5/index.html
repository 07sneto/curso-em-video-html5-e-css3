<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando com Links</title>
</head>
<body>

    <h1>Usando links externos</h1>

    <p>Você pode acessar o meu <a href="https://github.com/07sneto/Curso-em-Video-HTML-e-CSS-Modulo-1" target="_blank" rel="external">repositório público no GitHub</a></p>

    <p>Você também pode visitar o meu <a href="https://www.linkedin.com/in/sneto07/" target="_blank" rel="external">LikedIn</a></p>

    <!-- O atributo href é usado para especificar o URL do link -->
    <!-- O atributo target="_self" abre o link na mesma aba -->
    <!-- O atributo rel="next" indica que o link leva à próxima página -->
    <!-- O atributo rel="prev" indica que o link leva à página anterior -->
    <!-- O atributo rel="nofollow" indica que o link não deve ser seguido pelo Google -->
    <!-- O atributo / é usado para acessar arquivos em uma pasta -->
    <!-- O atributo ../ é usado para acessar arquivos na pasta anterior -->

</body>
</html>
