<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Tags HTML</title>

<body>

    <h1>Desafio: Tags em HTML5</h1>

    <p> Em HTML5, podemos inserir vários elementos em uma página. Passe o mouse sobre os itens para descobrir qual tag usar em cada caso.</p>

    <ul>
        <li><abbr title="Use a tag <p>">Parágrafos</abbr></li>

        <li><abbr title="Use a tag <h1> até <h6>">Títulos</abbr></li>

        <li><abbr title="Use a tag <img>">Imagens</abbr></li>

        <li><abbr title="Use a tag <abbr>">Abreviações</abbr></li>

        <li><abbr title="Use a tag <code>">Códigos-fonte</abbr></li>

        <li><abbr title="Use a tag <ol>">Listas numeradas</abbr></li>

        <li><abbr title="Use a tag <ul>">Listas com marcadores</abbr></li>
    </ul>

</body>
